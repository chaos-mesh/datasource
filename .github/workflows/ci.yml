name: CI

on:
  push:
    branches:
      - master
      - release-3.x
  pull_request:
    branches:
      - master
      - release-3.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm action uses the packageManager field in package.json to
      # understand which version to install.
      - uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check types
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:ci
      - name: Build frontend
        run: pnpm run build

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]
          then
            echo "has-backend=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@v4
        with:
          version: latest
          args: coverage

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@v4
        with:
          version: latest
          args: buildAll

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Start Grafana
        run: docker compose -f e2e/docker-compose.yaml up -d --build --wait

      - name: Run Playwright tests
        run: pnpm run e2e

      - name: Docker logs
        if: failure()
        run: docker compose -f e2e/docker-compose.yaml logs grafana

      - name: Stop Grafana
        if: always()
        run: docker compose -f e2e/docker-compose.yaml down --volumes

      - name: Archive E2E output
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
          retention-days: 5
