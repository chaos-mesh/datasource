name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v2
        with:
          node-version: '22'
          policy_token: ${{ secrets.POLICY_TOKEN }}
